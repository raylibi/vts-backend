name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Migrasi + smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vts_logistik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: vts_logistik_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: secret-khusus-ci-minimal-16-karakter
      JWT_EXPIRES_IN: 1h
      # Broker sengaja tidak disediakan: backend harus tetap melayani HTTP
      # walau MQTT tidak tersambung (hanya retry di belakang layar).
      MQTT_BROKER_URL: mqtt://localhost:1883
      MQTT_TOPIC_TELEMETRY: vts/telemetry/+
      MQTT_TOPIC_STATUS: vts/status/+
      CLIENT_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cek sintaks seluruh file JavaScript
        run: git ls-files '*.js' | xargs -n1 node --check

      - name: Jalankan migrasi
        run: npm run migrate

      - name: Jalankan server di latar belakang
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "Server siap setelah ${i} detik."
              exit 0
            fi
            sleep 1
          done
          echo "Server tidak siap dalam 30 detik. Log:"
          cat server.log
          exit 1

      - name: Smoke test
        run: npm test

      - name: Tampilkan log server bila gagal
        if: failure()
        run: cat server.log || true

      - name: Hentikan server
        if: always()
        run: kill "$(cat server.pid)" || true
